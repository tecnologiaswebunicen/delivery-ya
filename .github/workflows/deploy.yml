name: Manual Deploy

# Deploy por SSH: corre deploy.sh en el servidor con una imagen ya publicada
# por el workflow "Build". Sirve también para rollback: elegí un sha- anterior.
run-name: Deploy ${{ inputs.tag || format('sha-{0}', github.sha) }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de imagen (ej. sha-<commit> o 1.2.0). Vacío = sha- del último commit de la rama elegida'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Aparece en la pestaña "Deployments" del repo; permite agregar
    # aprobación manual desde Settings > Environments si algún día la querés.
    environment: prod
    # Nunca dos deploys a la vez; si se lanzan dos seguidos, el segundo espera.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          DEFAULT_TAG: sha-${{ github.sha }}
        run: |
          TAG="${INPUT_TAG:-$DEFAULT_TAG}"
          # El tag termina en un comando del shell remoto: solo caracteres
          # válidos de un tag de Docker, nada que el shell pueda interpretar.
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::Tag inválido: '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Falla acá (y no en el servidor) si el tag no existe en el registry.
      - name: Check image exists
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}:${TAG}"
          docker buildx imagetools inspect "$IMAGE" > /dev/null \
            || { echo "::error::No existe la imagen $IMAGE (¿terminó el workflow Build?)"; exit 1; }

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          # Si vienen vacíos, el "environment:" del job no coincide con el
          # environment donde están cargados los secrets.
          : "${SSH_KEY:?SSH_KEY vacío: revisá el nombre del environment}"
          : "${SSH_PASSPHRASE:?SSH_PASSPHRASE vacío: revisá el nombre del environment}"
          : "${SSH_KNOWN_HOSTS:?SSH_KNOWN_HOSTS vacío: cargalo con ssh-keyscan -H <host>}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Quita la passphrase de la copia en el runner (efímero), así ssh
          # puede usarla sin prompt. Falla acá si la passphrase es incorrecta.
          ssh-keygen -p -q -f ~/.ssh/deploy_key -P "$SSH_PASSPHRASE" -N ""
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          TAG: ${{ steps.tag.outputs.tag }}
        # Ajustá la ruta si deploy.sh no está en ~/apps/backend
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" "~/apps/backend/deploy.sh $TAG"
